name: Release (desktop app)

# Builds, signs and notarizes the Electron app on a version tag and creates a
# DRAFT GitHub release. A human tests the installers and publishes the draft.
#
# Required repository secrets:
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD        Developer ID Application certificate
#   APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key (notarization)
#   WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD        Windows code-signing certificate (or switch to a cloud signer)
#
# Pin third-party actions to SHAs before first use:  pinact run

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches package.json and is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$TAG" ] || { echo "Tag $TAG does not match package.json $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/keys/apple_api_key.p8" >> "$GITHUB_ENV"

      # electron-builder signs when CSC_LINK is set, notarizes when the APPLE_API_* variables
      # are set, and with "--publish always" uploads to a draft GitHub release.
      - name: Build, sign, notarize, upload to draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || runner.os == 'Windows' && secrets.WIN_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || runner.os == 'Windows' && secrets.WIN_CERT_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Remove key material
        if: always() && runner.os == 'macOS'
        run: rm -rf "$RUNNER_TEMP/keys"
