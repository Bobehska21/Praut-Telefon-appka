name: CI

# NOTE: third-party actions below use version tags for readability.
# Pin them to commit SHAs before first use:  brew install pinact && pinact run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run db:migrate --if-present
      - run: npm run test:integration --if-present

  e2e:
    name: E2E (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Build (unsigned)
        run: npm run build --if-present
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: E2E (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e --if-present
      - name: E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e --if-present
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy-config:
    name: Helm charts and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1 # Helm 4: --rollback-on-failure replaces --atomic
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Lint and validate every chart for every environment
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in deploy/helm/*/; do
            for values in "$chart"values-*.yaml; do
              echo "::group::$chart ($(basename "$values"))"
              helm lint "$chart" -f "$values" --set image.tag=0.0.0-ci
              helm template release "$chart" -f "$values" --set image.tag=0.0.0-ci \
                | kubeconform -strict -ignore-missing-schemas -summary \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done
      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        env:
          # the chart refuses to render without a tag; without this trivy scans nothing
          TRIVY_HELM_SET: image.tag=0.0.0-ci
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --redact --no-banner

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm audit --omit=dev --audit-level=high
