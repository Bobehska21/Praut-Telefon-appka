name: Deploy (backend)

# Deferred backend deployment template. Once step 4 is resumed, builds an image and deploys to
# production only after approval on the "production" GitHub Environment
# (Settings -> Environments -> production -> Required reviewers).
#
# Each environment needs a secret KUBECONFIG_B64: a kubeconfig for a ServiceAccount
# limited to the app namespace. Prefer OIDC with your cloud provider when available.
#
# Pin third-party actions to SHAs before first use:  pinact run

# Step 4 is deferred. Keep this template manual so merging the mobile app does not
# attempt to build a missing server/Dockerfile or deploy infrastructure.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE: app
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  staging:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1 # Helm 4: --rollback-on-failure replaces --atomic
      - name: Deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm upgrade --install "$SERVICE" "deploy/helm/$SERVICE" -n "$SERVICE" \
            -f "deploy/helm/$SERVICE/values-staging.yaml" \
            --set image.repository="$IMAGE" --set image.tag="$TAG" \
            --rollback-on-failure --timeout 5m
          rm -f "$RUNNER_TEMP/kubeconfig"

  production:
    name: Deploy to production
    needs: [image, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # requires manual approval
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1 # Helm 4: --rollback-on-failure replaces --atomic
      - name: Deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm upgrade --install "$SERVICE" "deploy/helm/$SERVICE" -n "$SERVICE" \
            -f "deploy/helm/$SERVICE/values-prod.yaml" \
            --set image.repository="$IMAGE" --set image.tag="$TAG" \
            --rollback-on-failure --timeout 10m
          rm -f "$RUNNER_TEMP/kubeconfig"
