# Defaults. Override per environment in values-<env>.yaml only where it differs.
# NEVER put secret values in any values file — reference a Secret instead.

nameOverride: ""
fullnameOverride: ""

image:
  repository: app
  # Set by CI / the deploy command (--set image.tag=...). Never "latest".
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Port the container listens on.
containerPort: 3000

# Non-secret environment variables.
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PHOTO_STORAGE: s3
  RATE_LIMIT_STORE: postgres
  S3_REGION: us-east-1
#  LOG_LEVEL: info

# Environment variables read from existing Secrets (created outside this chart,
# e.g. from a SOPS-encrypted file in deploy/secrets/).
envFromSecrets:
  - name: ADMIN_TOKEN
    secretName: focus-server
    key: admin-token
  - name: S3_BUCKET
    secretName: focus-server
    key: s3-bucket
  - name: S3_ACCESS_KEY_ID
    secretName: focus-server
    key: s3-access-key-id
  - name: S3_SECRET_ACCESS_KEY
    secretName: focus-server
    key: s3-secret-access-key
#  - name: SESSION_SECRET
#    secretName: app-secrets
#    key: session-secret

probes:
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 3
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Must be longer than the application's graceful shutdown.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  # Name of an existing TLS Secret (e.g. issued by cert-manager). Empty = no TLS.
  tlsSecretName: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespace of the ingress controller that may reach the pods.
  ingressNamespace: ingress-nginx
  # Extra egress rules (raw NetworkPolicy egress entries), e.g. to an external API.
  extraEgress: []
  # HTTPS to S3. Restrict destinations with extraEgress when the provider has fixed CIDRs.
  allowObjectStorageHttps: true

serviceAccount:
  create: true
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []

# PostgreSQL managed by the CloudNativePG operator (must be installed in the cluster).
# The operator creates the Secret "<release>-db-app"; the app gets DATABASE_URL from its "uri" key.
database:
  enabled: true
  instances: 1
  # Empty = operator default image.
  imageName: ""
  name: app
  owner: app
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # PostgreSQL parameters (strings), e.g. max_connections: "100"
  parameters: {}
  # Raw CloudNativePG ".spec.backup" block. Empty = no backups (local only!).
  backup: {}
  # Cron (6 fields, with seconds) for a ScheduledBackup. Empty = none.
  backupSchedule: ""
  # Use instead of the managed cluster: name of an existing Secret with key "uri".
  existingSecret: ""

# Runs migrations in pod init containers and a pre-upgrade hook with the app image.
# Migrations must be backwards compatible: old pods keep serving during the rollout.
migrations:
  enabled: true
  command: ["node", "dist/migrate.js"]
  backoffLimit: 1
  activeDeadlineSeconds: 600
